<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Kit — Mekânını kur</title><meta name="color-scheme" content="dark"></head><body>
<header><a class="brand" href="https://gokhanbiyik.com/nexus/">N<span>↗</span> NEXUS INTERLINK</a><span class="edition">OPEN TOOLKIT / 0.3 PREVIEW</span><select id="language" aria-label="Language"><option value="tr">TR</option><option value="en">EN</option></select></header>
<main><section class="intro"><p class="eyebrow" data-tr="BAĞIMSIZ MEKÂNLAR. ORTAK BİR EVREN." data-en="INDEPENDENT PLACES. A SHARED UNIVERSE."></p><h1 data-tr="Bir mekân kur.<br>Bir dünyaya bağlan." data-en="Make a place.<br>Connect a world."></h1><p data-tr="Atölyen, stüdyon, küçük dükkânın. Kendi araçların, kendi alan adın. İlk taslağı burada kur; ayrıntıları Blender’da veya AI yardımcınla geliştir." data-en="Your atelier, studio, little shop. Your tools, your domain. Shape a first draft here; refine it in Blender or with your AI assistant."></p></section>
<div class="workspace"><section class="preview"><div class="preview-top"><span>01 / LIVE DIORAMA</span><span class="live">● LOCAL</span></div><div id="world" aria-label="3D preview: drag to orbit and scroll to zoom"></div><div class="preview-bottom"><span data-tr="Sürükle: döndür · Kaydır: yaklaş" data-en="Drag: orbit · Scroll: zoom"></span><span id="metrics"></span></div><p id="fallback" hidden>3D unavailable. The form, layout list and export still work.</p></section>
<section class="editor"><nav class="steps" aria-label="Setup steps"><button data-step="0" class="active" data-tr="1 Kimlik" data-en="1 Identity"></button><button data-step="1" data-tr="2 Yerleşim" data-en="2 Layout"></button><button data-step="2" data-tr="3 Bağlan" data-en="3 Connect"></button></nav>
<form id="form"><div data-panel="0"><h2 data-tr="Mekânın bir hikâyesi var." data-en="Your place has a story."></h2><label><span data-tr="Mekân adı" data-en="Place name"></span><input id="name" required minlength="2" maxlength="70" value="Açık Atölye"></label><label><span data-tr="HTTPS site adresin" data-en="Your HTTPS site URL"></span><input id="url" type="url" required value="https://my-studio.example/"></label><label><span data-tr="Mekân türü" data-en="Place type"></span><select id="kind"><option value="studio">Studio / Atölye</option><option value="gallery">Gallery / Galeri</option><option value="shop">Shop / Dükkân</option><option value="garden">Garden / Bahçe</option><option value="simulation">Digital world / Simülasyon</option></select></label><label><span data-tr="Kısa hikâye" data-en="Short story"></span><textarea id="description" maxlength="600" rows="3">Birlikte üretmek ve fikir paylaşmak için küçük bir atölye.</textarea></label><p class="note" data-tr="Örnek alan adını yayın öncesi kendi adresinle değiştir. Konum paylaşman gerekmez." data-en="Replace the example domain with your own before publishing. Location is optional."></p></div>
<div data-panel="1" hidden><h2 data-tr="Küçük başla. Sana benzesin." data-en="Start small. Make it yours."></h2><div class="pair"><label><span data-tr="Genişlik (m)" data-en="Width (m)"></span><input id="width" type="number" min="3" max="16" step=".1" value="8"></label><label><span data-tr="Derinlik (m)" data-en="Depth (m)"></span><input id="depth" type="number" min="3" max="16" step=".1" value="6"></label></div><div class="pair"><select id="item-type" aria-label="Object type"><option value="table">Table / Masa</option><option value="seat">Seat / Koltuk</option><option value="plant">Plant / Bitki</option><option value="frame">Art / Eser</option><option value="portal">Portal / Geçit</option></select><button type="button" id="add" data-tr="+ Nesne ekle" data-en="+ Add object"></button></div><div id="items"></div><label><span data-tr="Referans fotoğrafları / kroki (yalnız önizleme)" data-en="Reference photos / sketch (preview only)"></span><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="references"></div><p class="note" data-tr="Fotoğraflar yüklenmez veya ZIP’e eklenmez. Oda taslağı otomatik fotoğraf rekonstrüksiyonu değildir." data-en="Photos are not uploaded or included in the ZIP. This draft is not automatic photo reconstruction."></p></div>
<div data-panel="2" hidden><h2 data-tr="Bir kapı, başka bir dünyaya." data-en="A door to another world."></h2><label><span data-tr="Bağlantı adı" data-en="Link label"></span><input id="link-label" maxlength="80" value="Nexus Atlas"></label><label><span data-tr="Hedef HTTPS adresi" data-en="Destination HTTPS URL"></span><input id="link-url" type="url" value="https://gokhanbiyik.com/nexus/"></label><button type="button" id="brief" data-tr="AI için tasarım özetini indir" data-en="Download a brief for your AI"></button><label><span data-tr="AI / araç çıktısı place.json içe aktar" data-en="Import place.json from your AI / tools"></span><input id="import" type="file" accept=".json,application/json"></label><p class="note" data-tr="Claude veya ChatGPT’ye özeti ver; yalnız paylaşmak istediğin referansları sen ekle. JSON çıktısını burada içe aktar." data-en="Give the brief to Claude or ChatGPT, adding only references you choose to share. Import the returned JSON here."></p><button type="button" id="download" class="primary" data-tr="Projeyi indir ↗" data-en="Download project ↗"></button><p class="note" data-tr="ZIP düzenlenebilir kaynak projedir: Node 22.12+, npm install, npm run dev. Yayın için npm run build → dist klasörünü kendi HTTPS alan adına yükle. Harita kaydı bakımcı incelemesi gerektirir." data-en="The ZIP contains editable source: Node 22.12+, npm install, npm run dev. Publish with npm run build → host dist on your HTTPS domain. Atlas registration requires maintainer review."></p></div></form><p id="message" role="status" aria-live="polite"></p><div class="navigation"><button id="previous" data-tr="← Geri" data-en="← Back"></button><button id="next" data-tr="Devam →" data-en="Continue →"></button></div></section></div>
<section class="principles"><article><span>01</span><h3 data-tr="Mekân senin." data-en="Own your place."></h3><p data-tr="Dosyaların, alan adın ve yaratıcı seçimlerin sende kalır." data-en="Keep your files, domain and creative choices."></p></article><article><span>02</span><h3 data-tr="Araçlarını seç." data-en="Choose your tools."></h3><p data-tr="Blender, GLB üreten araçlar veya isteğe bağlı AI yardımı." data-en="Blender, tools that export GLB, or optional AI assistance."></p></article><article><span>03</span><h3 data-tr="Birbirine referans ver." data-en="Reference one another."></h3><p data-tr="Bağımsız dünyalar HTTPS bağlantılarıyla buluşur." data-en="Independent worlds meet through HTTPS links."></p></article></section></main><footer>GPL-3.0-or-later tooling · Apache-2.0 templates & protocol · No account · No tracking</footer><script type="module" src="./main.js"></script></body></html>
