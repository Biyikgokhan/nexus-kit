<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Nexus Interlink: independent places, shared connections</title><desc id="desc">Referansların become an editable stylized place using a wizard, creative tools or optional AI. Host on your own HTTPS domain. Link to other artists and studios with a public manifest.</desc>
