name: Verify kit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:wizard
      - run: npm pack --dry-run
      - run: node bin/nexus-kit.mjs init .ci-place --yes --name=Test-Studio --url=https://studio.example
      - run: npm install --ignore-scripts
        working-directory: .ci-place
      - run: npm run build
        working-directory: .ci-place
